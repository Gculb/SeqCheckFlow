name: SeqCheckFlow HG002 Nextflow benchmark

on:
  workflow_dispatch:
    inputs:
      interval:
        description: GRCh38 autosomal region; whole-chromosome runs need high-memory compute
        required: true
        default: chr20:10000000-11000000
        type: string
      threads:
        description: Threads for alignment, recalibration, and variant calling
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "4"

permissions:
  contents: read

jobs:
  hg002-regional-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "24.10.5"

      - name: Build pinned SeqCheckFlow tool image
        run: docker build -f containers/Dockerfile -t seqcheckflow:latest .

      - name: Prepare and run the HG002 pilot
        env:
          HG002_INTERVAL: ${{ inputs.interval || 'chr20:10000000-11000000' }}
          HG002_THREADS: ${{ inputs.threads || '2' }}
        run: |
          nextflow run hg002.nf \
            -profile docker \
            --interval "${HG002_INTERVAL}" \
            --threads "${HG002_THREADS}" \
            --outdir "${RUNNER_TEMP}/seqcheckflow-hg002-results" \
            -with-report "${RUNNER_TEMP}/hg002-nextflow-report.html" \
            -with-trace "${RUNNER_TEMP}/hg002-nextflow-trace.txt"

      - name: Verify benchmark outputs
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/seqcheckflow-hg002-results"
          test -s "${results}/variants/calls.vcf.gz"
          test -s "${results}/truth_evaluation/rtg_eval/summary.txt"
          test -s "${results}/qc/vcf_qc/calls_report.json"

      - name: Save benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: hg002-nextflow-results
          path: |
            ${{ runner.temp }}/seqcheckflow-hg002-results/
            ${{ runner.temp }}/hg002-nextflow-report.html
            ${{ runner.temp }}/hg002-nextflow-trace.txt
