<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">HG002 chr21 runtime and sampled memory comparison</title>
  <desc id="desc">One run took 1,140.59 seconds for the direct baseline and 1,157.60 seconds for SeqCheckFlow wrappers. Peak sampled process-tree RSS was 592.7 and 603.8 mebibytes respectively.</desc>
  <rect width="960" height="410" fill="#ffffff"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">HG002 chr21 runtime and sampled memory</text>
  <text x="36" y="70" font-family="Arial, sans-serif" font-size="14" fill="#526174">One sequential run per implementation; differences are descriptive, not a performance claim</text>
  <rect x="602" y="91" width="14" height="14" rx="2" fill="#355c9a"/><text x="623" y="103" font-family="Arial, sans-serif" font-size="13" fill="#26354a">Direct-tool baseline</text>
  <rect x="770" y="91" width="14" height="14" rx="2" fill="#24a18a"/><text x="791" y="103" font-family="Arial, sans-serif" font-size="13" fill="#26354a">SeqCheckFlow wrappers</text>
  <text x="36" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#26354a">Total workflow wall time (0–1,200 seconds)</text>
  <text x="36" y="176" font-family="Arial, sans-serif" font-size="13" fill="#526174">Direct baseline</text>
  <text x="36" y="205" font-family="Arial, sans-serif" font-size="13" fill="#526174">SeqCheckFlow wrappers</text>
  <rect x="170" y="160" width="500" height="19" rx="4" fill="#edf1f5"/><rect x="170" y="189" width="500" height="19" rx="4" fill="#edf1f5"/>
  <rect x="170" y="160" width="475.25" height="19" rx="4" fill="#355c9a"/><rect x="170" y="189" width="482.33" height="19" rx="4" fill="#24a18a"/>
  <text x="658" y="176" font-family="Arial, sans-serif" font-size="13" fill="#26354a">1,140.59 s</text>
  <text x="665" y="205" font-family="Arial, sans-serif" font-size="13" fill="#26354a">1,157.60 s (+1.49%)</text>
  <text x="36" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#26354a">Peak sampled process-tree RSS (0–650 MiB)</text>
  <text x="36" y="290" font-family="Arial, sans-serif" font-size="13" fill="#526174">Direct baseline</text>
  <text x="36" y="319" font-family="Arial, sans-serif" font-size="13" fill="#526174">SeqCheckFlow wrappers</text>
  <rect x="170" y="274" width="500" height="19" rx="4" fill="#edf1f5"/><rect x="170" y="303" width="500" height="19" rx="4" fill="#edf1f5"/>
  <rect x="170" y="274" width="456.0" height="19" rx="4" fill="#355c9a"/><rect x="170" y="303" width="464.5" height="19" rx="4" fill="#24a18a"/>
  <text x="638" y="290" font-family="Arial, sans-serif" font-size="13" fill="#26354a">592.7 MiB</text>
  <text x="646" y="319" font-family="Arial, sans-serif" font-size="13" fill="#26354a">603.8 MiB (+11.1 MiB)</text>
  <text x="36" y="365" font-family="Arial, sans-serif" font-size="12" fill="#526174">Single measurement; RSS sampled every 50 ms and summed across processes, so shared memory can be double-counted.</text>
</svg>
